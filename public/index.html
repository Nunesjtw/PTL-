<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* superfícies: cinza-asfalto, quase preto */
    --bg: #101012; --s1: #0b0b0c; --s2: #17171a; --s3: #212125;
    --ring: rgba(255, 255, 255, .07);
    /* texto */
    --text: #f4f4f5; --dim: #a1a1aa;
    /* destaque: bronze / laranja + branco absoluto */
    --accent: #e8893a; --accent-soft: #f6b57a; --accent-ink: #1a0f05; --white: #fff;
    --danger: #ef5469; --ok: #3ddc97; --r: 14px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --font-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-dot: Doto, "DotGothic16", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; scrollbar-width: thin; scrollbar-color: #2b2b30 transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; height: 100dvh; background: var(--bg); color: var(--text);
    font: 14.5px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  svg { display: block; flex: none; }
  .av { display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }

  /* ---------- sidebar (sem bordas: separação só por tom de fundo) ---------- */
  aside { background: var(--s1); padding: 20px 12px 12px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; font-family: var(--font-dot); font-size: 26px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
  .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #000; background: var(--white); }
  .sec { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--dim); font-weight: 500; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; }
  .icon-btn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--dim); transition: background-color .15s ease, color .15s ease, transform .14s var(--ease-out); }
  .icon-btn:active, .cb:active, .send:active { transform: scale(.96); }
  #channels { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin-top: -10px; }
  .ch { border-radius: 12px; cursor: pointer; padding: 3px; transition: background-color .15s ease; }
  .ch.on { background: rgba(255, 255, 255, .06); }
  .ch-row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; color: var(--dim); font-weight: 500; transition: color .15s ease; }
  .ch.on .ch-row { color: var(--white); }
  .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(232, 137, 58, .7); }
  .mem { margin: 0 0 5px 37px; display: flex; flex-direction: column; gap: 5px; }
  .mem .u { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; font-weight: 400; }

  /* card do usuário: pílula */
  .me { display: flex; align-items: center; gap: 11px; padding: 8px 20px 8px 8px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--ring); border-radius: 9999px; }
  .me b { display: block; font-weight: 600; line-height: 1.25; }
  .me small { color: var(--dim); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .me small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .me.live small::before { background: var(--ok); }

  /* ---------- área central: gradiente bronze + grid sutil ---------- */
  main { position: relative; isolation: isolate; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background:
      radial-gradient(70% 48% at 50% 108%, rgba(190, 104, 40, .24) 0%, rgba(120, 62, 22, .09) 48%, transparent 78%),
      var(--bg); }
  main::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 85% at 50% 45%, #000 25%, transparent 100%);
    mask-image: radial-gradient(ellipse 90% 85% at 50% 45%, #000 25%, transparent 100%); }
  .top { height: 64px; padding: 0 22px; display: flex; flex-direction: column; justify-content: center; flex: none; }
  .top strong { font-family: var(--font-dot); font-size: 24px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
  .top span { color: var(--dim); font-size: 12.5px; }
  #stage { flex: 1; min-height: 0; overflow: auto; padding: 20px; display: grid; gap: 14px; align-content: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .tile { position: relative; background: #000; box-shadow: 0 0 0 1px var(--ring), 0 12px 32px rgba(0, 0, 0, .45); border-radius: var(--r); overflow: hidden; aspect-ratio: 16/9; cursor: pointer; animation: pop .2s var(--ease-out); }
  .tile video { width: 100%; height: 100%; object-fit: contain; }
  .tile span { position: absolute; left: 12px; bottom: 12px; background: rgba(11, 11, 12, .85); backdrop-filter: blur(8px); padding: 3px 12px; border-radius: 9999px; font-size: 12.5px; font-weight: 500; }
  #empty { grid-column: 1 / -1; align-self: center; justify-self: center; text-align: center; padding: 12vh 20px; max-width: 420px; animation: fade .25s ease-out; }
  #empty .ring { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; display: grid; place-items: center; color: var(--white); background: var(--s2);
    box-shadow: 0 0 0 1px rgba(232, 137, 58, .4), 0 0 44px rgba(232, 137, 58, .14); }
  #empty h2 { font-family: var(--font-dot); font-size: 30px; font-weight: 800; line-height: 1.1; margin-bottom: 10px; letter-spacing: .02em; }
  #empty p { color: var(--dim); }
  #empty h2, #empty p, #empty .ring { text-shadow: 0 0 18px var(--bg), 0 0 40px var(--bg); }
  #flow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  #flow.on { opacity: .9; }

  #bar { display: flex; justify-content: center; padding: 6px 16px 22px; flex: none; }
  .pill { display: flex; gap: 8px; padding: 7px; background: rgba(23, 23, 26, .9); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--ring), 0 12px 32px rgba(0, 0, 0, .55); border-radius: 9999px; }
  .cb { height: 46px; min-width: 46px; padding: 0 16px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--s3); font-weight: 500;
    transition: background-color .16s ease, color .16s ease, transform .14s var(--ease-out); }
  .cb.off { background: rgba(239, 84, 105, .14); color: #ff8a9b; }
  .cb.live { background: var(--accent); color: var(--accent-ink); }
  .cb.leave { background: var(--danger); color: #fff; }

  /* ---------- chat ---------- */
  #chat { background: var(--s1); display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow: auto; padding: 14px 10px 6px; display: flex; flex-direction: column; }
  #msgs:empty::before { content: attr(data-empty); margin: auto; max-width: 220px; text-align: center; color: var(--dim); }
  .m { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 6px 10px; border-radius: 12px; margin-top: 8px; }
  .m.same { margin-top: 0; padding-top: 1px; padding-bottom: 1px; }
  .m.live { animation: rise .18s var(--ease-out); }
  .m .mh { display: flex; align-items: baseline; gap: 8px; }
  .m b { font-weight: 600; }
  .m time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .m .mt { overflow-wrap: anywhere; color: #d4d4d8; }

  /* input de mensagem: pílula */
  #composer { margin: 10px 14px 14px; display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 20px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--ring); border-radius: 9999px; transition: box-shadow .15s ease; }
  #composer:focus-within { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6); }
  #txt { flex: 1; min-width: 0; padding: 8px 0; background: none; border: 0; }
  #txt:focus { outline: none; }
  #txt::placeholder { color: var(--dim); }
  .send { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--white); color: #000; transition: background-color .15s ease, opacity .15s ease, transform .14s var(--ease-out); }
  .send:disabled { background: var(--s3); color: var(--dim); }

  #bunny { position: fixed; top: 3px; right: 14px; width: 62px; height: 62px; z-index: 5; pointer-events: none; }
  #bunny svg { width: 100%; height: 100%; overflow: visible; }
  #bunny .iris { transition: transform .09s ease-out; }

  .fs { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(11, 11, 12, .85); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px var(--ring); color: var(--text);
    opacity: 0; transition: opacity .15s ease, transform .14s var(--ease-out); }
  .fs:focus-visible { opacity: 1; }
  .fs:active { transform: scale(.96); }
  @media (hover: hover) { .tile:hover .fs { opacity: 1; } }
  @media (hover: none) { .fs { opacity: 1; } }
  .tile:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; box-shadow: none; border-radius: 0; background: #000; }
  .tile:-webkit-full-screen { width: 100vw; height: 100vh; aspect-ratio: auto; box-shadow: none; border-radius: 0; background: #000; }
  .tabs { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fade { from { opacity: 0; } }

  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover { background: var(--s3); color: var(--white); }
    .ch:not(.on):hover { background: rgba(255, 255, 255, .04); }
    .ch:not(.on):hover .ch-row { color: var(--text); }
    .cb:hover { background: #2c2c31; }
    .cb.off:hover { background: rgba(239, 84, 105, .24); }
    .cb.live:hover { background: var(--accent-soft); }
    .cb.leave:hover { background: #dc3f56; }
    .send:not(:disabled):hover { background: #e4e4e7; }
    .m:hover { background: rgba(255, 255, 255, .035); }
  }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    aside, main, #chat { display: none; grid-row: 1; }
    body[data-pane="canais"] aside, body[data-pane="call"] main, body[data-pane="chat"] #chat { display: flex; }
    .top { padding-right: 76px; }
    .me { display: none; }
    #bunny { width: 50px; height: 50px; right: 12px; }
    #stage { padding: 14px; }
    #bar { padding-bottom: 14px; }
    .cb span { display: none; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); grid-row: 2; background: var(--s1); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tabs button { position: relative; padding: 10px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 500; transition: color .15s ease; }
    .tabs button[aria-current="true"] { color: var(--white); }
    .tabs i { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 10.5px/16px var(--font-ui); text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .m.live { animation-name: fade; }
    .icon-btn:active, .cb:active, .send:active { transform: none; }
    #bunny .iris { transition: none; }
  }
</style>
</head>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ---------- fundo animado: fluxo de dados (canvas) ---------- */
const flow = (() => {
  const canvas = document.getElementById('flow');
  const host = canvas.parentElement;           // <main>, coluna central
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ajustes rápidos */
  const N = 40;          // pontos amostrados por curva
  const RADIUS = 150;    // alcance do mouse (px)
  const PULL = 2600;     // força de atração (negativo = repele)
  const K = 55;          // rigidez da mola (volta ao lugar)
  const DAMP = 9;        // amortecimento (menor = mais elástico)

  /* grupos de origem (frações da área): x, y inicial/final, linhas, colunas */
  const GROUPS = [
    { x: .085, y0: .18, y1: .31,  rows: 14, cols: 4, lineCols: 3 },
    { x: .060, y0: .52, y1: .575, rows: 7,  cols: 2, lineCols: 2 },
    { x: .105, y0: .71, y1: .80,  rows: 12, cols: 3, lineCols: 2 },
  ];
  const COL_FACTOR = [1, .55, .3, .16];

  let W = 0, H = 0, dpr = 1, active = false, raf = 0, last = 0;
  let lines = [], dots = [], grad = null, glow = null;
  const node = { x: 0, y: 0 };
  const mouse = { x: -9999, y: -9999 };

  function rng(seed) {                         // aleatório estável entre resizes
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeLine(sx, sy, f, r) {
    const dx = node.x - sx;
    const k1 = .32 + r() * .06, k2 = .34 + r() * .08;
    const c1x = sx + dx * k1, c1y = sy;
    const c2x = node.x - dx * k2, c2y = node.y + (sy - node.y) * .03;
    const px = new Float32Array(N), py = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), m = 1 - t;
      const a = m * m * m, b = 3 * m * m * t, c = 3 * m * t * t, d = t * t * t;
      px[i] = a * sx + b * c1x + c * c2x + d * node.x;
      py[i] = a * sy + b * c1y + c * c2y + d * node.y;
    }
    return {
      px, py, f,
      ox: new Float32Array(N), oy: new Float32Array(N),
      vx: new Float32Array(N), vy: new Float32Array(N),
      b: .55 + r() * .45, hot: r() < .1,
      p: r(), speed: .09 + r() * .17,
    };
  }

  function build() {
    const r = rng(7);
    lines = []; dots = [];
    node.x = W * .8; node.y = H * .6;
    GROUPS.forEach((g) => {
      for (let c = 0; c < g.cols; c++) {
        const shift = c * .026 * H;
        const top = g.y0 * H - shift, bot = g.y1 * H - shift * 1.5;
        const x = g.x * W + c * W * .052 * (1 - c * .08);
        for (let i = 0; i < g.rows; i++) {
          const u = g.rows > 1 ? i / (g.rows - 1) : .5;
          const sx = x + u * 8, sy = top + (bot - top) * u;
          dots.push({ x: sx, y: sy, a: COL_FACTOR[c] });
          if (c < g.lineCols) lines.push(makeLine(sx, sy, COL_FACTOR[c], r));
        }
      }
    });
    // as linhas ficam mais fortes perto do nó (como no fluxo convergindo)
    grad = ctx.createLinearGradient(W * .05, 0, node.x, 0);
    grad.addColorStop(0, 'rgba(255,255,255,.025)');
    grad.addColorStop(.5, 'rgba(255,255,255,.05)');
    grad.addColorStop(.85, 'rgba(255,255,255,.14)');
    grad.addColorStop(1, 'rgba(255,255,255,.4)');
    glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 42);
    glow.addColorStop(0, 'rgba(246,181,122,.4)');
    glow.addColorStop(1, 'rgba(246,181,122,0)');
  }

  /* física elástica: cada ponto da curva é uma mola puxada pelo mouse */
  function step(dt) {
    const mx = mouse.x, my = mouse.y, R2 = RADIUS * RADIUS;
    for (const L of lines) {
      for (let i = 1; i < N - 1; i++) {
        let fx = 0, fy = 0;
        const dx = mx - L.px[i], dy = my - L.py[i], d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          const d = Math.sqrt(d2) + .001, q = 1 - d / RADIUS;
          const s = PULL * q * q * Math.min(d / 40, 1) / d;
          fx = dx * s; fy = dy * s;
        }
        L.vx[i] += (-K * L.ox[i] - DAMP * L.vx[i] + fx) * dt;
        L.vy[i] += (-K * L.oy[i] - DAMP * L.vy[i] + fy) * dt;
        L.ox[i] += L.vx[i] * dt;
        L.oy[i] += L.vy[i] * dt;
      }
      L.p += L.speed * dt;
      if (L.p > 1) L.p -= 1;
    }
  }

  const pos = { x: 0, y: 0 };
  function at(L, t) {                           // posição na curva já deformada
    const fi = t * (N - 1), i = Math.min(fi | 0, N - 2), fr = fi - i;
    pos.x = (L.px[i] + L.ox[i]) * (1 - fr) + (L.px[i + 1] + L.ox[i + 1]) * fr;
    pos.y = (L.py[i] + L.oy[i]) * (1 - fr) + (L.py[i + 1] + L.oy[i + 1]) * fr;
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // pontos de origem
    ctx.fillStyle = '#fff';
    for (const d of dots) {
      ctx.globalAlpha = d.a * .8;
      ctx.fillRect(d.x - 1, d.y - 1, 2, 2);
    }

    // linhas
    ctx.lineWidth = 1;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = grad;
    for (const L of lines) {
      ctx.globalAlpha = Math.min(1, L.f * L.b * (L.hot ? 2.2 : 1));
      ctx.beginPath();
      ctx.moveTo(L.px[0], L.py[0]);
      for (let i = 1; i < N - 1; i++) {
        const x = L.px[i] + L.ox[i], y = L.py[i] + L.oy[i];
        const nx = L.px[i + 1] + L.ox[i + 1], ny = L.py[i + 1] + L.oy[i + 1];
        ctx.quadraticCurveTo(x, y, (x + nx) / 2, (y + ny) / 2);
      }
      ctx.lineTo(L.px[N - 1], L.py[N - 1]);
      ctx.stroke();
    }

    // partículas viajando pelas curvas
    ctx.fillStyle = '#fff';
    for (const L of lines) {
      const ramp = Math.sqrt(Math.sin(Math.PI * L.p)) * (.35 + .65 * L.p);
      for (let k = 0; k < 3; k++) {
        const t = L.p - k * .012;
        if (t < 0) continue;
        at(L, t);
        ctx.globalAlpha = ramp * (1 - k * .32) * (.35 + .65 * L.f) * .8;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 1.4 - k * .3, 0, 6.2832);
        ctx.fill();
      }
    }

    // nó central
    const pulse = .5 + .5 * Math.sin(now * .0016);
    ctx.save();
    ctx.translate(node.x, node.y);
    ctx.globalAlpha = .55 + .3 * pulse;
    ctx.fillStyle = glow;
    ctx.fillRect(-42, -42, 84, 84);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(240,238,236,.95)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-6, -6, 12, 12, 3); else ctx.rect(-6, -6, 12, 12);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!W) return;
    step(dt);
    draw(now);
  }
  function start() { if (raf || reduce) return; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  function resize() {
    if (!active) return;
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) { W = H = 0; return; }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    build();
    if (reduce) draw(0);                        // sem movimento: um quadro estático
  }

  function setActive(on) {
    on = !!on;
    if (on === active) return;
    active = on;
    canvas.classList.toggle('on', on);
    if (on) { resize(); start(); } else stop();
  }

  host.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  host.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else if (active) start();
  });

  setActive(true);
  return { setActive };
})();

function avatar(nm, size) {

$('#logo').innerHTML = svg('phone', 18);

/* ---------- conexão ---------- */
let name = localStorage.name || prompt('Seu nome:') || 'Eu';
localStorage.name = name;

const socket = io({ autoConnect: false });
let ice = [{ urls: 'stun:stun.l.google.com:19302' }];
fetch('/ice').then((r) => r.json()).then((j) => (ice = j)).catch(() => {});

let channels = [], cur = null, micStream = null, screenStream = null, localTile = null;
let muted = false, deaf = false;
const peers = new Map();

/* ---------- interface ---------- */
function ui() {
  const box = $('#channels');
  box.innerHTML = '';
  channels.forEach((c) => {
    const d = document.createElement('div');
    d.className = 'ch' + (c.id === cur ? ' on' : '');
    const row = document.createElement('div');
    row.className = 'ch-row';
    row.innerHTML = svg('vol', 18);
    const n = document.createElement('span');
    n.textContent = c.name;
    row.append(n);
    if (c.id === cur) { const dt = document.createElement('span'); dt.className = 'dot'; row.append(dt); }
    d.append(row);
    if (c.members.length) {
      const m = document.createElement('div');
      m.className = 'mem';
      c.members.forEach((u) => {
        const r = document.createElement('div');
        r.className = 'u';
        const t = document.createElement('span');
        t.textContent = u.name;
        r.append(avatar(u.name, 22), t);

      });

    }

    d.tabIndex = 0; d.setAttribute('role', 'button');
    d.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); join(c.id); } };

  });

  const ch = channels.find((c) => c.id === cur);
  $('#title').textContent = ch ? ch.name : 'Chamada';
  $('#sub').textContent = ch ? ch.members.length + (ch.members.length === 1 ? ' pessoa na call' : ' pessoas na call') : 'Escolha um canal de voz para entrar';
  $('#chsub').textContent = ch ? '#' + ch.name : 'Entre em um canal para conversar';

  const me = $('#me');
  me.className = 'me' + (cur ? ' live' : '');
  me.innerHTML = '';
  const info = document.createElement('div');
  const b = document.createElement('b'); b.textContent = name;
  const sm = document.createElement('small'); sm.textContent = ch ? 'Em ' + ch.name : 'Online';
  info.append(b, sm);
  me.append(avatar(name, 36), info);

  $('#bar').hidden = !cur;
  const mm = muted || deaf;

  $('#txt').disabled = !cur;

socket.on('channels', (l) => { channels = l; ui(); });
$('#newch').onclick = () => { const n = prompt('Nome do canal:'); if (n) socket.emit('create', n); };

/* ---------- chat ---------- */
let last = null;
function addMsg(m, live) {
  const box = $('#msgs');
  const same = last && last.name === m.name && m.t - last.t < 300000;
  last = m;
  const d = document.createElement('div');
  d.className = 'm' + (same ? ' same' : '') + (live ? ' live' : '');
  const body = document.createElement('div');
  if (!same) {
    const h = document.createElement('div');
    h.className = 'mh';
    const b = document.createElement('b'); b.textContent = m.name;
    const t = document.createElement('time');
    t.textContent = new Date(m.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    h.append(b, t);
    body.append(h);
  }
  const tx = document.createElement('div');
  tx.className = 'mt'; tx.textContent = m.text;
  body.append(tx);
  d.append(same ? document.createElement('div') : avatar(m.name, 32), body);
  box.append(d);
  box.scrollTop = box.scrollHeight;
}
function clearMsgs() { $('#msgs').innerHTML = ''; last = null; }
let unread = 0, away = 0, pane = 'canais';
const isMobile = () => matchMedia('(max-width: 900px)').matches;
function setPane(p) { pane = p; document.body.dataset.pane = p; if (p === 'chat') unread = 0; ui(); }
function renderTabs() {
  const defs = { canais: ['list', 'Canais'], call: ['phone', 'Chamada'], chat: ['msg', 'Chat'] };
  for (const k in defs) {
    const b = $('#tb-' + k);
    b.dataset.p = k;
    b.innerHTML = svg(defs[k][0], 22) + '<span>' + defs[k][1] + '</span>' + (k === 'chat' && unread ? '<i>' + (unread > 9 ? '9+' : unread) + '</i>' : '');
    b.setAttribute('aria-current', String(pane === k));
    b.onclick = () => setPane(k);
  }
}
socket.on('chat', (m) => {
  addMsg(m, true);
  if (m.name === name) return;
  if (isMobile() && pane !== 'chat') { unread++; ui(); }
  if (document.hidden) { away++; document.title = '(' + away + ') Chamada'; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { away = 0; document.title = 'Chamada'; } });
function send() {

  if (cur && i.value.trim()) { socket.emit('chat', i.value); i.value = ''; }
}
$('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('#send').onclick = () => { send(); $('#txt').focus(); };

/* ---------- entrar / sair ---------- */
async function join(id) {
  if (id === cur) return;
  if (cur) leave();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    micStream = null;
    alert('Não consegui acessar o microfone. Você vai entrar só ouvindo.');
  }
  applyAll();
  cur = id;
  socket.emit('join', id, (r) => {
    clearMsgs();
    r.messages.forEach(addMsg);
    r.peers.forEach((p) => makePeer(p.id, p.name));
    if (isMobile()) setPane('call'); else ui();
  });
}

function leave() {
  if (!cur) return;
  socket.emit('leave');
  stopShare();
  peers.forEach((p, id) => dropPeer(id));
  micStream?.getTracks().forEach((t) => t.stop());
  micStream = null; cur = null;
  clearMsgs();
  ui();
}
$('#leave').onclick = leave;
socket.on('disconnect', leave);

/* ---------- WebRTC (peer a peer) ---------- */
function makePeer(id, pname) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection({ iceServers: ice });
  const p = { pc, name: pname, polite: socket.id < id, making: false, ignore: false, els: new Map(), senders: [] };
  peers.set(id, p);
  pc.onicecandidate = (e) => e.candidate && socket.emit('signal', { to: id, data: { candidate: e.candidate } });
  pc.onnegotiationneeded = async () => {
    try {
      p.making = true;
      await pc.setLocalDescription();
      socket.emit('signal', { to: id, data: { description: pc.localDescription } });
    } catch (e) { console.error(e); } finally { p.making = false; }
  };
  pc.ontrack = (e) => addRemote(p, e);
  if (micStream) micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));
  else pc.addTransceiver('audio', { direction: 'recvonly' });
  if (screenStream) sendScreen(p);
  return p;
}

function dropPeer(id) {
  const p = peers.get(id);
  if (!p) return;
  p.pc.close();
  p.els.forEach((el) => el.tile.remove());
  peers.delete(id);
  ui();
}

socket.on('peer:joined', (p) => makePeer(p.id, p.name));
socket.on('peer:left', dropPeer);
socket.on('peer:share', ({ id, on }) => {
  const p = peers.get(id);
  if (!p || on) return;
  p.els.forEach((el, sid) => { if (el.tile.dataset.screen) { el.tile.remove(); p.els.delete(sid); } });
  ui();
});

socket.on('signal', async ({ from, data }) => {
  const p = peers.get(from) || makePeer(from, 'Alguém');
  const pc = p.pc;
  try {
    if (data.description) {
      const d = data.description;
      const collision = d.type === 'offer' && (p.making || pc.signalingState !== 'stable');
      p.ignore = !p.polite && collision;
      if (p.ignore) return;
      await pc.setRemoteDescription(d);
      if (d.type === 'offer') {
        await pc.setLocalDescription();
        socket.emit('signal', { to: from, data: { description: pc.localDescription } });
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(data.candidate); } catch (e) { if (!p.ignore) throw e; }
    }
  } catch (e) { console.error(e); }
});

/* ---------- tela cheia ---------- */
function toggleFS(tile, v) {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const f = tile.requestFullscreen || tile.webkitRequestFullscreen;
  if (f) f.call(tile);
  else v.webkitEnterFullscreen?.();
}
function addFS(tile, v) {
  const b = document.createElement('button');
  b.className = 'fs';
  b.title = 'Tela cheia (ou clique duas vezes)';
  b.setAttribute('aria-label', 'Tela cheia');
  b.innerHTML = svg('expand', 18);
  b.onclick = (e) => { e.stopPropagation(); toggleFS(tile, v); };
  tile.append(b);
  tile.ondblclick = () => toggleFS(tile, v);
}
function syncFS() {
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  document.querySelectorAll('.fs').forEach((b) => { b.innerHTML = svg(fe === b.parentNode ? 'shrink' : 'expand', 18); });
}
document.addEventListener('fullscreenchange', syncFS);
document.addEventListener('webkitfullscreenchange', syncFS);

function addRemote(p, e) {
  const s = e.streams[0];
  if (!s) return;
  let el = p.els.get(s.id);
  if (!el) {
    el = document.createElement('video');
    el.autoplay = true; el.playsInline = true; el.muted = deaf;
    el.srcObject = s;
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.hidden = true;
    const label = document.createElement('span');
    label.textContent = p.name;
    tile.append(el, label);
    addFS(tile, el);
    $('#stage').append(tile);
    el.tile = tile;
    p.els.set(s.id, el);
    s.onremovetrack = () => {
      if (!s.getVideoTracks().length) tile.hidden = true;
      if (!s.getTracks().length) { tile.remove(); p.els.delete(s.id); }
      ui();
    };
  }
  if (e.track.kind === 'video') { el.tile.hidden = false; el.tile.dataset.screen = '1'; }
  ui();
}

/* ---------- microfone e áudio ---------- */
function applyAll() {
  micStream?.getAudioTracks().forEach((t) => (t.enabled = !muted && !deaf));
  peers.forEach((p) => p.els.forEach((el) => (el.muted = deaf)));
  ui();
}
$('#mic').onclick = () => { if (deaf) { deaf = false; muted = false; } else muted = !muted; applyAll(); };
$('#deaf').onclick = () => { deaf = !deaf; applyAll(); };

/* ---------- compartilhar tela (1080p 60 fps) ---------- */
async function tune(sender) {
  if (sender.track?.kind !== 'video') return;
  try {
    const q = sender.getParameters();
    q.encodings = q.encodings?.length ? q.encodings : [{}];
    q.encodings[0].maxBitrate = 12_000_000;
    q.encodings[0].maxFramerate = 60;
    q.encodings[0].scaleResolutionDownBy = 1;
    q.encodings[0].priority = 'high';
    q.encodings[0].networkPriority = 'high';
    q.degradationPreference = 'maintain-resolution';
    await sender.setParameters(q);
  } catch (e) { console.warn(e); }
}
function sendScreen(p) {
  p.senders = screenStream.getTracks().map((t) => p.pc.addTrack(t, screenStream));
  [800, 2500].forEach((ms) => setTimeout(() => p.senders.forEach(tune), ms));
}
async function toggleShare() {
  if (screenStream) return stopShare();
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
      audio: true,
    });
  } catch (e) { return; }
  const v = screenStream.getVideoTracks()[0];
  v.contentHint = 'motion';
  v.onended = stopShare;
  const vid = document.createElement('video');
  vid.autoplay = true; vid.muted = true; vid.srcObject = screenStream;
  const label = document.createElement('span'); label.textContent = 'Sua tela';
  localTile = document.createElement('div');
  localTile.className = 'tile';
  localTile.append(vid, label);
  addFS(localTile, vid);
  $('#stage').append(localTile);
  peers.forEach(sendScreen);
  socket.emit('share', true);
  ui();
}
function stopShare() {
  if (!screenStream) return;
  screenStream.getTracks().forEach((t) => t.stop());
  peers.forEach((p) => {
    p.senders.forEach((s) => { try { p.pc.removeTrack(s); } catch (e) {} });
    p.senders = [];
  });
  localTile?.remove(); localTile = null;
  screenStream = null;
  socket.emit('share', false);
  ui();
}
$('#share').onclick = toggleShare;

/* ---------- diagnóstico (aparece no console, F12) ---------- */
setInterval(async () => {
  if (screenStream) {
    const s = screenStream.getVideoTracks()[0].getSettings();
    console.log('captura:', s.width + 'x' + s.height, s.frameRate + 'fps');
  }
  for (const p of peers.values()) {
    (await p.pc.getStats()).forEach((r) => {
      if (r.type === 'outbound-rtp' && r.kind === 'video')
        console.log('envio:', r.frameWidth + 'x' + r.frameHeight, r.framesPerSecond + 'fps', 'limite:', r.qualityLimitationReason, 'codec:', r.encoderImplementation);
    });
  }
}, 3000);

/* ---------- coelhinho: olhos seguem o mouse ---------- */
const irises = [...document.querySelectorAll('#bunny .iris')];
addEventListener('pointermove', (e) => {
  irises.forEach((g) => {
    const r = g.parentNode.querySelector('.sclera').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const a = Math.atan2(e.clientY - cy, e.clientX - cx);
    const d = Math.min(Math.hypot(e.clientX - cx, e.clientY - cy) / 90, 1) * 3.8;
    g.style.transform = 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px)';
  });
});

ui();
start();
</script>
