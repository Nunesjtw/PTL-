<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050309; --s1: #0b0711; --s2: #130d1d; --s3: #1c1429; --line: #221833; --line2: #302346;
    --text: #efebf8; --dim: #9d93b6; --accent: #7c3aed; --accent-soft: #b9a6fb;
    --danger: #ef5469; --ok: #3ddc97; --r: 12px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; height: 100dvh; background: var(--bg); color: var(--text);
    font: 14.5px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  svg { display: block; flex: none; }
  .av { display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; flex: none; }

  aside { background: var(--s1); border-right: 1px solid var(--line); padding: 20px 12px 12px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--accent); }
  .sec { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--dim); font-weight: 600; font-size: 13px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--dim); transition: background-color .15s ease, color .15s ease, transform .14s var(--ease-out); }
  .icon-btn:active, .cb:active, .send:active { transform: scale(.96); }
  #channels { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin-top: -10px; }
  .ch { border-radius: 10px; cursor: pointer; padding: 3px; transition: background-color .15s ease; }
  .ch.on { background: var(--s3); }
  .ch-row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; color: var(--dim); font-weight: 600; transition: color .15s ease; }
  .ch.on .ch-row { color: var(--text); }
  .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-soft); }
  .mem { margin: 0 0 5px 37px; display: flex; flex-direction: column; gap: 5px; }
  .mem .u { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; font-weight: 500; }
  .me { display: flex; align-items: center; gap: 11px; padding: 10px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); }
  .me b { display: block; font-weight: 700; line-height: 1.25; }
  .me small { color: var(--dim); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .me small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .me.live small::before { background: var(--ok); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { height: 64px; padding: 0 22px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--line); flex: none; }
  .top strong { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .top span { color: var(--dim); font-size: 12.5px; }
  #stage { flex: 1; min-height: 0; overflow: auto; padding: 20px; display: grid; gap: 14px; align-content: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
  .tile { position: relative; background: #000; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; aspect-ratio: 16/9; cursor: pointer; animation: pop .2s var(--ease-out); }
  .tile video { width: 100%; height: 100%; object-fit: contain; }
  .tile span { position: absolute; left: 12px; bottom: 12px; background: #0b0711; border: 1px solid var(--line2); padding: 3px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
  #empty { grid-column: 1 / -1; align-self: center; justify-self: center; text-align: center; padding: 12vh 20px; max-width: 400px; animation: fade .25s ease-out; }
  #empty .ring { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); background: var(--s2); border: 1px solid var(--line2); }
  #empty h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.01em; }
  #empty p { color: var(--dim); }

  #bar { display: flex; justify-content: center; padding: 6px 16px 22px; flex: none; }
  .pill { display: flex; gap: 8px; padding: 7px; background: var(--s2); border: 1px solid var(--line2); border-radius: 999px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  .cb { height: 46px; min-width: 46px; padding: 0 15px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--s3); font-weight: 600;
    transition: background-color .16s ease, color .16s ease, transform .14s var(--ease-out); }
  .cb.off { background: rgba(239, 84, 105, .16); color: #ff8a9b; }
  .cb.live { background: var(--accent); color: #fff; }
  .cb.leave { background: var(--danger); color: #fff; }

  #chat { border-left: 1px solid var(--line); background: var(--s1); display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow: auto; padding: 14px 10px 6px; display: flex; flex-direction: column; }
  #msgs:empty::before { content: attr(data-empty); margin: auto; max-width: 220px; text-align: center; color: var(--dim); }
  .m { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 6px 10px; border-radius: 10px; margin-top: 8px; }
  .m.same { margin-top: 0; padding-top: 1px; padding-bottom: 1px; }
  .m.live { animation: rise .18s var(--ease-out); }
  .m .mh { display: flex; align-items: baseline; gap: 8px; }
  .m b { font-weight: 700; }
  .m time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .m .mt { overflow-wrap: anywhere; color: #ddd7ee; }
  #composer { margin: 10px 14px 14px; display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 14px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s ease; }
  #composer:focus-within { border-color: var(--accent); }
  #txt { flex: 1; min-width: 0; padding: 8px 0; background: none; border: 0; }
  #txt:focus { outline: none; }
  #txt::placeholder { color: var(--dim); }
  .send { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; transition: background-color .15s ease, opacity .15s ease, transform .14s var(--ease-out); }
  .send:disabled { background: var(--s3); color: var(--dim); }

  #bunny { position: fixed; top: 3px; right: 14px; width: 62px; height: 62px; z-index: 5; pointer-events: none; }
  #bunny svg { width: 100%; height: 100%; overflow: visible; }
  #bunny .iris { transition: transform .09s ease-out; }

  .fs { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: #0b0711; border: 1px solid var(--line2); color: var(--text);
    opacity: 0; transition: opacity .15s ease, transform .14s var(--ease-out); }
  .fs:focus-visible { opacity: 1; }
  .fs:active { transform: scale(.96); }
  @media (hover: hover) { .tile:hover .fs { opacity: 1; } }
  @media (hover: none) { .fs { opacity: 1; } }
  .tile:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; background: #000; }
  .tile:-webkit-full-screen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; background: #000; }
  .tabs { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fade { from { opacity: 0; } }

  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover { background: var(--s3); color: var(--text); }
    .ch:not(.on):hover { background: var(--s2); }
    .ch:not(.on):hover .ch-row { color: var(--text); }
    .cb:hover { background: #271a44; }
    .cb.off:hover { background: rgba(239, 84, 105, .26); }
    .cb.live:hover { background: #6d28d9; }
    .cb.leave:hover { background: #dc3f56; }
    .send:not(:disabled):hover { background: #6d28d9; }
    .m:hover { background: var(--s2); }
  }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    aside, main, #chat { display: none; grid-row: 1; border: 0; }
    body[data-pane="canais"] aside, body[data-pane="call"] main, body[data-pane="chat"] #chat { display: flex; }
    .top { padding-right: 76px; }
    .me { display: none; }
    #bunny { width: 50px; height: 50px; right: 12px; }
    #stage { padding: 14px; }
    #bar { padding-bottom: 14px; }
    .cb span { display: none; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); grid-row: 2; background: var(--s1); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tabs button { position: relative; padding: 10px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 600; transition: color .15s ease; }
    .tabs button[aria-current="true"] { color: var(--text); }
    .tabs i { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font: 700 10.5px/16px Manrope, system-ui, sans-serif; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .m.live { animation-name: fade; }
    .icon-btn:active, .cb:active, .send:active { transform: none; }
    #bunny .iris { transition: none; }
  }
</style>
</head>
<body data-pane="canais">
<div id="bunny" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <g transform="rotate(-9 34 24)"><ellipse cx="34" cy="24" rx="10" ry="22" fill="#e6dff7"/><ellipse cx="34" cy="26" rx="5" ry="16" fill="#f2a9d2"/></g>
    <g transform="rotate(9 66 24)"><ellipse cx="66" cy="24" rx="10" ry="22" fill="#e6dff7"/><ellipse cx="66" cy="26" rx="5" ry="16" fill="#f2a9d2"/></g>
    <ellipse cx="50" cy="63" rx="35" ry="30" fill="#ece6f9"/>
    <circle cx="23" cy="72" r="5.5" fill="#f58fb8" opacity=".7"/><circle cx="77" cy="72" r="5.5" fill="#f58fb8" opacity=".7"/>
    <g><path d="M69 36 60 29.5v13Z M69 36 78 29.5v13Z" fill="#f0609e"/><circle cx="69" cy="36" r="2.6" fill="#ff8ec1"/></g>
    <g>
      <circle class="sclera" cx="36" cy="60" r="9.5" fill="#fff"/>
      <g class="iris"><circle cx="36" cy="60" r="5.2" fill="#8a5a2b"/><circle cx="36" cy="60" r="5.2" fill="none" stroke="#5a3714" stroke-width="1"/><circle cx="36" cy="60" r="2.4" fill="#1a0e05"/><circle cx="34.3" cy="58.3" r="1.2" fill="#fff"/></g>
    </g>
    <g>
      <circle class="sclera" cx="64" cy="60" r="9.5" fill="#fff"/>
      <g class="iris"><circle cx="64" cy="60" r="5.2" fill="#8a5a2b"/><circle cx="64" cy="60" r="5.2" fill="none" stroke="#5a3714" stroke-width="1"/><circle cx="64" cy="60" r="2.4" fill="#1a0e05"/><circle cx="62.3" cy="58.3" r="1.2" fill="#fff"/></g>
    </g>
    <g fill="rgba(255,255,255,.08)" stroke="#2a1850" stroke-width="2.6">
      <circle cx="36" cy="60" r="13.5"/><circle cx="64" cy="60" r="13.5"/>
    </g>
    <path d="M49.5 59.5h1" stroke="#2a1850" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M22.5 59 15 56M77.5 59 85 56" stroke="#2a1850" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="none" stroke="#20102f" stroke-linecap="round">
      <path d="M26.3 58.5A9.8 9.8 0 0 1 45.7 58.5M54.3 58.5A9.8 9.8 0 0 1 73.7 58.5" stroke-width="2.2"/>
      <path d="M27.3 57.7 20.1 55.7M29.1 54.2 23.4 49.4M32.2 51.8 29 45M36 51 36 44.5" stroke-width="2"/>
      <path d="M72.7 57.7 79.9 55.7M70.9 54.2 76.6 49.4M67.8 51.8 71 45M64 51 64 44.5" stroke-width="2"/>
    </g>
    <ellipse cx="50" cy="75" rx="3.2" ry="2.4" fill="#e8799f"/>
    <path d="M50 77.4v3M50 80.4q-3.5 3.2-7 .6M50 80.4q3.5 3.2 7 .6" fill="none" stroke="#5b4a78" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</div>
<aside>
  <div class="brand"><div class="logo" id="logo"></div><span>Chamada</span></div>
  <div class="sec"><span>Canais de voz</span><button id="newch" class="icon-btn" title="Novo canal de voz" aria-label="Novo canal de voz"></button></div>
  <div id="channels"></div>
  <div id="me" class="me"></div>
</aside>

<main>
  <div class="top"><strong id="title">Chamada</strong><span id="sub"></span></div>
  <div id="stage">
    <div id="empty"><div class="ring" id="ering"></div><h2 id="et"></h2><p id="ed"></p></div>
  </div>
  <div id="bar" hidden>
    <div class="pill">
      <button class="cb" id="mic"></button>
      <button class="cb" id="deaf"></button>
      <button class="cb" id="share"></button>
      <button class="cb leave" id="leave"></button>
    </div>
  </div>
</main>

<section id="chat">
  <div class="top"><strong>Chat</strong><span id="chsub">Entre em um canal para conversar</span></div>
  <div id="msgs"></div>
  <div id="composer"><input id="txt" placeholder="Entre em um canal para conversar" maxlength="1000" autocomplete="off" aria-label="Mensagem" disabled><button class="send" id="send" aria-label="Enviar mensagem" disabled></button></div>
</section>

<nav class="tabs" aria-label="Seções"><button data-p="canais" id="tb-canais"></button><button data-p="call" id="tb-call"></button><button data-p="chat" id="tb-chat"></button></nav>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);

/* ---------- ícones e avatares ---------- */
const P = {
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>',
  phoneOff: '<path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="m22 2-20 20"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  micOff: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="m2 2 20 20"/>',
  head: '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
  headOff: '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/><path d="m2 2 20 20"/>',
  screen: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
  vol: '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  shrink: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
};
const svg = (n, s = 20) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[n] + '</svg>';
function avatar(nm, size) {
  let h = 0;
  for (const ch of nm) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const d = document.createElement('div');
  d.className = 'av';
  d.style.cssText = 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.42) + 'px;background:hsl(' + (250 + (h % 80)) + ',55%,48%)';
  d.textContent = (nm.trim()[0] || '?').toUpperCase();
  return d;
}
$('#logo').innerHTML = svg('phone', 18);
$('#newch').innerHTML = svg('plus', 16);
$('#ering').innerHTML = svg('phone', 28);
$('#send').innerHTML = svg('send', 18);

/* ---------- conexão ---------- */
let name = localStorage.name || prompt('Seu nome:') || 'Eu';
localStorage.name = name;
let code = localStorage.code || '';

const socket = io({ autoConnect: false });
let ice = [{ urls: 'stun:stun.l.google.com:19302' }];
fetch('/ice').then((r) => r.json()).then((j) => (ice = j)).catch(() => {});
function start() { socket.auth = { name, code }; socket.connect(); }
socket.on('connect_error', (e) => {
  if (e.message === 'code') {
    const c = prompt('Código de acesso:');
    if (c === null) return;
    code = c; localStorage.code = c; start();
  }
});

let channels = [], cur = null, micStream = null, screenStream = null, localTile = null;
let muted = false, deaf = false;
const peers = new Map();

/* ---------- interface ---------- */
function ui() {
  const box = $('#channels');
  box.innerHTML = '';
  channels.forEach((c) => {
    const d = document.createElement('div');
    d.className = 'ch' + (c.id === cur ? ' on' : '');
    const row = document.createElement('div');
    row.className = 'ch-row';
    row.innerHTML = svg('vol', 18);
    const n = document.createElement('span');
    n.textContent = c.name;
    row.append(n);
    if (c.id === cur) { const dt = document.createElement('span'); dt.className = 'dot'; row.append(dt); }
    d.append(row);
    if (c.members.length) {
      const m = document.createElement('div');
      m.className = 'mem';
      c.members.forEach((u) => {
        const r = document.createElement('div');
        r.className = 'u';
        const t = document.createElement('span');
        t.textContent = u.name;
        r.append(avatar(u.name, 22), t);
        m.append(r);
      });
      d.append(m);
    }
    d.onclick = () => join(c.id);
    d.tabIndex = 0; d.setAttribute('role', 'button');
    d.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); join(c.id); } };
    box.append(d);
  });

  const ch = channels.find((c) => c.id === cur);
  $('#title').textContent = ch ? ch.name : 'Chamada';
  $('#sub').textContent = ch ? ch.members.length + (ch.members.length === 1 ? ' pessoa na call' : ' pessoas na call') : 'Escolha um canal de voz para entrar';
  $('#chsub').textContent = ch ? '#' + ch.name : 'Entre em um canal para conversar';

  const me = $('#me');
  me.className = 'me' + (cur ? ' live' : '');
  me.innerHTML = '';
  const info = document.createElement('div');
  const b = document.createElement('b'); b.textContent = name;
  const sm = document.createElement('small'); sm.textContent = ch ? 'Em ' + ch.name : 'Online';
  info.append(b, sm);
  me.append(avatar(name, 36), info);

  $('#bar').hidden = !cur;
  const mm = muted || deaf;
  $('#mic').innerHTML = svg(mm ? 'micOff' : 'mic');
  $('#mic').title = mm ? 'Ativar microfone' : 'Mutar microfone';
  $('#mic').classList.toggle('off', mm);
  $('#deaf').innerHTML = svg(deaf ? 'headOff' : 'head');
  $('#deaf').title = deaf ? 'Ativar áudio' : 'Mutar áudio';
  $('#deaf').classList.toggle('off', deaf);
  $('#share').innerHTML = svg('screen') + '<span>' + (screenStream ? 'Parar transmissão' : 'Compartilhar tela') + '</span>';
  $('#share').classList.toggle('live', !!screenStream);
  $('#leave').innerHTML = svg('phoneOff') + '<span>Sair</span>';
  $('#txt').disabled = !cur;
  $('#send').disabled = !cur;
  $('#msgs').dataset.empty = cur ? 'Nenhuma mensagem ainda. Diga oi.' : 'Entre em um canal para ver e enviar mensagens.';
  renderTabs();
  $('#txt').placeholder = cur ? 'Enviar mensagem' : 'Entre em um canal para conversar';

  const hasTile = $('#stage .tile:not([hidden])');
  $('#empty').hidden = !!hasTile;
  $('#et').textContent = cur ? 'Você está na call' : 'Nenhum canal selecionado';
  $('#ed').textContent = cur ? 'Quando alguém compartilhar a tela, ela aparece aqui. Para transmitir a sua, use o botão Compartilhar tela.' : 'Escolha um canal de voz na lista à esquerda para começar a conversar.';
}
socket.on('channels', (l) => { channels = l; ui(); });
$('#newch').onclick = () => { const n = prompt('Nome do canal:'); if (n) socket.emit('create', n); };

/* ---------- chat ---------- */
let last = null;
function addMsg(m, live) {
  const box = $('#msgs');
  const same = last && last.name === m.name && m.t - last.t < 300000;
  last = m;
  const d = document.createElement('div');
  d.className = 'm' + (same ? ' same' : '') + (live ? ' live' : '');
  const body = document.createElement('div');
  if (!same) {
    const h = document.createElement('div');
    h.className = 'mh';
    const b = document.createElement('b'); b.textContent = m.name;
    const t = document.createElement('time');
    t.textContent = new Date(m.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    h.append(b, t);
    body.append(h);
  }
  const tx = document.createElement('div');
  tx.className = 'mt'; tx.textContent = m.text;
  body.append(tx);
  d.append(same ? document.createElement('div') : avatar(m.name, 32), body);
  box.append(d);
  box.scrollTop = box.scrollHeight;
}
function clearMsgs() { $('#msgs').innerHTML = ''; last = null; }
let unread = 0, away = 0, pane = 'canais';
const isMobile = () => matchMedia('(max-width: 900px)').matches;
function setPane(p) { pane = p; document.body.dataset.pane = p; if (p === 'chat') unread = 0; ui(); }
function renderTabs() {
  const defs = { canais: ['list', 'Canais'], call: ['phone', 'Chamada'], chat: ['msg', 'Chat'] };
  for (const k in defs) {
    const b = $('#tb-' + k);
    b.dataset.p = k;
    b.innerHTML = svg(defs[k][0], 22) + '<span>' + defs[k][1] + '</span>' + (k === 'chat' && unread ? '<i>' + (unread > 9 ? '9+' : unread) + '</i>' : '');
    b.setAttribute('aria-current', String(pane === k));
    b.onclick = () => setPane(k);
  }
}
socket.on('chat', (m) => {
  addMsg(m, true);
  if (m.name === name) return;
  if (isMobile() && pane !== 'chat') { unread++; ui(); }
  if (document.hidden) { away++; document.title = '(' + away + ') Chamada'; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { away = 0; document.title = 'Chamada'; } });
function send() {
  const i = $('#txt');
  if (cur && i.value.trim()) { socket.emit('chat', i.value); i.value = ''; }
}
$('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('#send').onclick = () => { send(); $('#txt').focus(); };

/* ---------- entrar / sair ---------- */
async function join(id) {
  if (id === cur) return;
  if (cur) leave();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    micStream = null;
    alert('Não consegui acessar o microfone. Você vai entrar só ouvindo.');
  }
  applyAll();
  cur = id;
  socket.emit('join', id, (r) => {
    clearMsgs();
    r.messages.forEach(addMsg);
    r.peers.forEach((p) => makePeer(p.id, p.name));
    if (isMobile()) setPane('call'); else ui();
  });
}

function leave() {
  if (!cur) return;
  socket.emit('leave');
  stopShare();
  peers.forEach((p, id) => dropPeer(id));
  micStream?.getTracks().forEach((t) => t.stop());
  micStream = null; cur = null;
  clearMsgs();
  ui();
}
$('#leave').onclick = leave;
socket.on('disconnect', leave);

/* ---------- WebRTC (peer a peer) ---------- */
function makePeer(id, pname) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection({ iceServers: ice });
  const p = { pc, name: pname, polite: socket.id < id, making: false, ignore: false, els: new Map(), senders: [] };
  peers.set(id, p);
  pc.onicecandidate = (e) => e.candidate && socket.emit('signal', { to: id, data: { candidate: e.candidate } });
  pc.onnegotiationneeded = async () => {
    try {
      p.making = true;
      await pc.setLocalDescription();
      socket.emit('signal', { to: id, data: { description: pc.localDescription } });
    } catch (e) { console.error(e); } finally { p.making = false; }
  };
  pc.ontrack = (e) => addRemote(p, e);
  if (micStream) micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));
  else pc.addTransceiver('audio', { direction: 'recvonly' });
  if (screenStream) sendScreen(p);
  return p;
}

function dropPeer(id) {
  const p = peers.get(id);
  if (!p) return;
  p.pc.close();
  p.els.forEach((el) => el.tile.remove());
  peers.delete(id);
  ui();
}

socket.on('peer:joined', (p) => makePeer(p.id, p.name));
socket.on('peer:left', dropPeer);
socket.on('peer:share', ({ id, on }) => {
  const p = peers.get(id);
  if (!p || on) return;
  p.els.forEach((el, sid) => { if (el.tile.dataset.screen) { el.tile.remove(); p.els.delete(sid); } });
  ui();
});

socket.on('signal', async ({ from, data }) => {
  const p = peers.get(from) || makePeer(from, 'Alguém');
  const pc = p.pc;
  try {
    if (data.description) {
      const d = data.description;
      const collision = d.type === 'offer' && (p.making || pc.signalingState !== 'stable');
      p.ignore = !p.polite && collision;
      if (p.ignore) return;
      await pc.setRemoteDescription(d);
      if (d.type === 'offer') {
        await pc.setLocalDescription();
        socket.emit('signal', { to: from, data: { description: pc.localDescription } });
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(data.candidate); } catch (e) { if (!p.ignore) throw e; }
    }
  } catch (e) { console.error(e); }
});

/* ---------- tela cheia ---------- */
function toggleFS(tile, v) {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const f = tile.requestFullscreen || tile.webkitRequestFullscreen;
  if (f) f.call(tile);
  else v.webkitEnterFullscreen?.();
}
function addFS(tile, v) {
  const b = document.createElement('button');
  b.className = 'fs';
  b.title = 'Tela cheia (ou clique duas vezes)';
  b.setAttribute('aria-label', 'Tela cheia');
  b.innerHTML = svg('expand', 18);
  b.onclick = (e) => { e.stopPropagation(); toggleFS(tile, v); };
  tile.append(b);
  tile.ondblclick = () => toggleFS(tile, v);
}
function syncFS() {
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  document.querySelectorAll('.fs').forEach((b) => { b.innerHTML = svg(fe === b.parentNode ? 'shrink' : 'expand', 18); });
}
document.addEventListener('fullscreenchange', syncFS);
document.addEventListener('webkitfullscreenchange', syncFS);

function addRemote(p, e) {
  const s = e.streams[0];
  if (!s) return;
  let el = p.els.get(s.id);
  if (!el) {
    el = document.createElement('video');
    el.autoplay = true; el.playsInline = true; el.muted = deaf;
    el.srcObject = s;
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.hidden = true;
    const label = document.createElement('span');
    label.textContent = p.name;
    tile.append(el, label);
    addFS(tile, el);
    $('#stage').append(tile);
    el.tile = tile;
    p.els.set(s.id, el);
    s.onremovetrack = () => {
      if (!s.getVideoTracks().length) tile.hidden = true;
      if (!s.getTracks().length) { tile.remove(); p.els.delete(s.id); }
      ui();
    };
  }
  if (e.track.kind === 'video') { el.tile.hidden = false; el.tile.dataset.screen = '1'; }
  ui();
}

/* ---------- microfone e áudio ---------- */
function applyAll() {
  micStream?.getAudioTracks().forEach((t) => (t.enabled = !muted && !deaf));
  peers.forEach((p) => p.els.forEach((el) => (el.muted = deaf)));
  ui();
}
$('#mic').onclick = () => { if (deaf) { deaf = false; muted = false; } else muted = !muted; applyAll(); };
$('#deaf').onclick = () => { deaf = !deaf; applyAll(); };

/* ---------- compartilhar tela (1080p 60 fps) ---------- */
async function tune(sender) {
  if (sender.track?.kind !== 'video') return;
  try {
    const q = sender.getParameters();
    q.encodings = q.encodings?.length ? q.encodings : [{}];
    q.encodings[0].maxBitrate = 12_000_000;
    q.encodings[0].maxFramerate = 60;
    q.encodings[0].scaleResolutionDownBy = 1;
    q.encodings[0].priority = 'high';
    q.encodings[0].networkPriority = 'high';
    q.degradationPreference = 'maintain-resolution';
    await sender.setParameters(q);
  } catch (e) { console.warn(e); }
}
function sendScreen(p) {
  p.senders = screenStream.getTracks().map((t) => p.pc.addTrack(t, screenStream));
  [800, 2500].forEach((ms) => setTimeout(() => p.senders.forEach(tune), ms));
}
async function toggleShare() {
  if (screenStream) return stopShare();
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
      audio: true,
    });
  } catch (e) { return; }
  const v = screenStream.getVideoTracks()[0];
  v.contentHint = 'motion';
  v.onended = stopShare;
  const vid = document.createElement('video');
  vid.autoplay = true; vid.muted = true; vid.srcObject = screenStream;
  const label = document.createElement('span'); label.textContent = 'Sua tela';
  localTile = document.createElement('div');
  localTile.className = 'tile';
  localTile.append(vid, label);
  addFS(localTile, vid);
  $('#stage').append(localTile);
  peers.forEach(sendScreen);
  socket.emit('share', true);
  ui();
}
function stopShare() {
  if (!screenStream) return;
  screenStream.getTracks().forEach((t) => t.stop());
  peers.forEach((p) => {
    p.senders.forEach((s) => { try { p.pc.removeTrack(s); } catch (e) {} });
    p.senders = [];
  });
  localTile?.remove(); localTile = null;
  screenStream = null;
  socket.emit('share', false);
  ui();
}
$('#share').onclick = toggleShare;

/* ---------- diagnóstico (aparece no console, F12) ---------- */
setInterval(async () => {
  if (screenStream) {
    const s = screenStream.getVideoTracks()[0].getSettings();
    console.log('captura:', s.width + 'x' + s.height, s.frameRate + 'fps');
  }
  for (const p of peers.values()) {
    (await p.pc.getStats()).forEach((r) => {
      if (r.type === 'outbound-rtp' && r.kind === 'video')
        console.log('envio:', r.frameWidth + 'x' + r.frameHeight, r.framesPerSecond + 'fps', 'limite:', r.qualityLimitationReason, 'codec:', r.encoderImplementation);
    });
  }
}, 3000);

/* ---------- coelhinho: olhos seguem o mouse ---------- */
const irises = [...document.querySelectorAll('#bunny .iris')];
addEventListener('pointermove', (e) => {
  irises.forEach((g) => {
    const r = g.parentNode.querySelector('.sclera').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const a = Math.atan2(e.clientY - cy, e.clientX - cx);
    const d = Math.min(Math.hypot(e.clientX - cx, e.clientY - cy) / 90, 1) * 3.8;
    g.style.transform = 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px)';
  });
});

ui();
start();
</script>
